<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap">
    <link rel="stylesheet" href="{{ "/assets/css/site.css" | relative_url }}">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        <nav class="nav" aria-label="Main">
          <a href="{{ "/" | relative_url }}"{% if page.url == "/" %} class="active"{% endif %}>Home</a>
          <div class="dropdown">
            <a href="{{ "/#research" | relative_url }}"{% if page.url contains "/research/" %} class="active"{% endif %} aria-haspopup="true">Research <span class="caret" aria-hidden="true">&#9662;</span></a>
            <div class="dropdown-menu">
              {% for p in site.data.projects %}<a href="{{ p.url | relative_url }}">{{ p.card }}</a>
              {% endfor %}
            </div>
          </div>
          <a href="{{ "/publications/" | relative_url }}"{% if page.url == "/publications/" %} class="active"{% endif %}>Publications</a>
          <a href="{{ "/CV_MRDanesh.pdf" | relative_url }}" target="_blank" rel="noopener noreferrer">CV</a>
        </nav>
      </div>
    </header>

    <main class="content">
      {{ content }}
    </main>

    <footer class="footer">
      {% for l in site.links %}<a href="{{ l.url | relative_url }}" target="_blank" rel="noopener noreferrer">{{ l.name }}</a>{% unless forloop.last %}<span aria-hidden="true"> | </span>{% endunless %}{% endfor %}
    </footer>

    {% if site.google_analytics %}
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
      ga('create', '{{ site.google_analytics }}', 'auto');
      ga('send', 'pageview');
    </script>
    {% endif %}
  </body>
</html>
